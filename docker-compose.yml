services:

  db:
    container_name: ruleengine-db
    image: postgres:16.6-alpine
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - db:/data/db
    networks:
      - net
    environment:
      - POSTGRES_DB=ruleenginedb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d ruleenginedb" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db:

networks:
  net:
    name: ruleengine-net
    driver: bridge
